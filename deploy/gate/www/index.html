<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Вход — Мой безопасный город</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap&subset=cyrillic" rel="stylesheet" />
    <style>
      :root {
        --green: #318420;
        --green-light: #9dca94;
        --orange: #ea853a;
        --ink: #1f2a1d;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: 'Nunito', system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(160deg, var(--green-light) 0%, #e8f3e4 55%, #fff6ec 100%);
        background-color: #e8f3e4;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 24px;
        padding: 36px 30px 32px;
        box-shadow: 0 18px 50px rgba(49, 132, 32, 0.22);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 800;
        color: var(--green);
        line-height: 1.2;
      }
      p.sub {
        margin: 0 0 26px;
        font-size: 17px;
        font-weight: 600;
        color: #5b6b57;
      }
      form { display: grid; gap: 14px; }
      input {
        font: inherit;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.12em;
        padding: 14px 16px;
        border-radius: 14px;
        border: 2px solid var(--green-light);
        outline: none;
        color: var(--ink);
      }
      input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(49, 132, 32, 0.15); }
      button {
        font: inherit;
        font-size: 20px;
        font-weight: 800;
        color: #fff;
        background: var(--orange);
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        cursor: pointer;
        box-shadow: 0 6px 0 #c96a25;
      }
      button:active { transform: translateY(3px); box-shadow: 0 3px 0 #c96a25; }
      .error {
        display: none;
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 700;
        color: #c0392b;
      }
      .error.show { display: block; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Мой безопасный город</h1>
      <p class="sub">Введи пароль, чтобы войти в игру</p>
      <p class="error" id="error">Пароль не подошёл, попробуй ещё раз</p>
      <form method="post" action="/gate/login" autocomplete="on">
        <input type="password" name="password" placeholder="Пароль" required autofocus autocomplete="current-password" />
        <button type="submit">Войти</button>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).has('error')) {
        document.getElementById('error').classList.add('show')
      }
    </script>
  </body>
</html>
